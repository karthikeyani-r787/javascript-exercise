<!--Build a small To-Do List using DOM manipulation.-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List</title>

    <style>
        body{
            min-height: 100vh;
            background:linear-gradient(lightblue,rgb(99, 99, 237),rgb(45, 45, 139),rgb(42, 42, 253),rgb(18, 9, 68),black);
            background-repeat: no-repeat;
            background-size: cover;
        }
        #input{
            text-align: center;
            padding: 50px;
            margin: 50px;
            border: solid black 5px;
            border-radius: 70px;
            background-color: rgb(246, 205, 228);
        }
        #taskInput{
            width: 300px;
            height: 30px;
            border: solid darkmagenta 2px;
            border-radius: 50px;
            background-color: rgb(209, 237, 247);
            box-shadow: 3px 5px ;
        }
        #addTask{
            padding: 3px;
            width: 80px;
            color: rgb(70, 21, 70);
            font-size: 20px;
            background-color: yellow;
            box-shadow: 3px 3px ;
        }
        #tasklist{
            border: solid black 3px;
            padding: 10px;
            margin: 60px;
            background-color: rgb(246, 205, 228);
            color: rgb(16, 8, 81);
            border: solid black;
            border-radius: 30px;
        }
    </style>
</head>
<body>
    <div id="input">
        <center>
            <input id="taskInput" type="text" placeholder="Enter your Task">
            <button id="addTask">Add</button>
        </center>
    </div>
    <div id="tasklist">
            <ul id="taskList">
                <h2 style="text-align: center; font-size: 35px; color: black; font-family:Arial, Helvetica, sans-serif;">Your Tasks</h2>
            </ul>
    </div>

    <script>
        const taskInput = document.getElementById("taskInput");
        const addTaskBtn = document.getElementById("addTask");
        const taskList = document.getElementById("taskList");

        addTaskBtn.addEventListener("click" , () => {
            const li = document.createElement("li");
            const deleteBtn = document.createElement("button");
            const completeBtn = document.createElement("button");
            li.textContent = taskInput.value;
            taskList.appendChild(li);
            taskInput.value = "";
        
            completeBtn.textContent = "Mark as Complete";
            li.appendChild(completeBtn);

            deleteBtn.textContent = "Delete";
            li.appendChild(deleteBtn);
            
            let completed = false;
            completeBtn.addEventListener("click" , () => {
                
                if(!completed){
                    completed = true ; 
                    li.style.textDecoration = "line-through";
                    completeBtn.textContent = "Completed";
                    
                    console.log("completed")
                }
                else{
                    completed = false;
                    li.style.textDecoration = "none";
                    completeBtn.textContent = "Mark as Complete";
                    
                    console.log(" un completed")

                }
            });

            deleteBtn.addEventListener("click" , () => { 
                taskList.removeChild(li)
            });
        });
    </script>
</body>
</html>
